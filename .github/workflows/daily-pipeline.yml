name: vidrot tests

# The daily loop runs in the local console (Vidrot.pyw), not on GitHub.
# A hosted runner cannot reach the owner's Veo key, ffmpeg bumpers, or
# Instagram session, and the old cron was what GitHub disabled for inactivity.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
