name: vidrot tests

# The daily loop runs on the owner's Fly.io app, not on GitHub.
# Actions only runs the unit tests. A hosted runner has no Veo key,
# ffmpeg volume, or Instagram session.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install "cryptography>=42,<50" "webauthn>=2.2,<3"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
