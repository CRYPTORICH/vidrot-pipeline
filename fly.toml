# Cheap always-on app. Create the volume before the first deploy:
#   fly volumes create vidrot_data --region iad --size 10
# Then: fly secrets set VIDROT_PASSWORD=... VIDROT_SECRET_KEY=... GEMINI_API_KEY=...
# See RUNBOOK.md. Do not put those values in this file.

app = "vidrot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[[mounts]]
  source = "vidrot_data"
  destination = "/data"
